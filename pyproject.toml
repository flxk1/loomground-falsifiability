[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "loomground-falsifiability"
description = "How could this evidence be shown wrong? Oversight signals ranked by falsifiability rather than treated as one kind. Self-report sits last on principle, and never alone."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSES/Apache-2.0.txt", "LICENSES/CC-BY-4.0.txt"]
authors = [{ name = "Loomground Contributors" }]
# One narrow problem, one dependency. This package sits *above* the reasoning
# kernel: it uses the shared verdict, the OPEN-dominant fold and the injected
# ports, and reaches into no solver internals. It is imported by hosts, never by
# solver, versum or governance.
dependencies = ["loomground-solver>=0.4,<0.5"]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/flxk1/loomground-falsifiability"
Repository = "https://github.com/flxk1/loomground-falsifiability"
Issues = "https://github.com/flxk1/loomground-falsifiability/issues"

[tool.setuptools.dynamic]
version = { attr = "loomground_falsifiability._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["loomground_falsifiability*"]

[tool.setuptools.package-data]
loomground_falsifiability = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
